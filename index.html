<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Помодоро</h1>

    <div class="duration-section">
      <div class="duration-group">
        <label>Работа (мин)</label>
        <input type="number" id="workMinutes" min="1" max="120" value="25">
      </div>
      <div class="duration-group">
        <label>Перерыв (мин)</label>
        <input type="number" id="breakMinutes" min="1" max="60" value="5">
      </div>
      <div class="duration-group">
        <label>Циклов (0 = ∞)</label>
        <input type="number" id="cycles" min="0" max="999" value="0">
      </div>
    </div>

    <div class="cycle-counter" id="cycleCounter">Цикл 1</div>
    <div class="status" id="status">Работа</div>
    <div class="timer" id="timer">25:00</div>

    <div class="controls">
      <button id="btnStart" class="btn btn-start">Старт</button>
      <button id="btnPause" class="btn btn-pause" disabled>Пауза</button>
      <button id="btnReset" class="btn btn-reset">Сброс</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
